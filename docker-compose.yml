services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-portfoliosos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_123}
      POSTGRES_DB: ${DB_NAME:-portfoliosos_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../portfolio-builder-api/scripts/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-portfoliosos} -d ${DB_NAME:-portfoliosos_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../portfolio-builder-api
    environment:
      DATABASE_URL: postgresql://${DB_USER:-portfoliosos}:${DB_PASSWORD:-dev_password_123}@postgres:5432/${DB_NAME:-portfoliosos_dev}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
      DEBUG: "false"
      CORS_ORIGINS: http://localhost:3000
      RESUME_UPLOAD_DIR: /app/data/uploads/resumes
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WIREFRAME_MODEL: ${OPENAI_WIREFRAME_MODEL:-gpt-4o-mini}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - resume_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  resume_uploads:
